<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitora+ - Login e Cadastro</title>
    <link rel="shortcut icon" href="../../../public /assets/Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="welcome-side" id="welcomeSide">
            <div class="logo-container">
                <div class="logo-icon"><img src="../../../public /assets/LogoComNome.png" alt=""></div>
            </div>
            <h1 id="welcomeTitle">Bem-vindo de volta</h1>
            <p id="welcomeText">Acesse sua conta para gerenciar o consumo dos seus clientes</p>
            <button class="btn-switch" onclick="toggleForm()" id="switchBtn">ENTRAR</button>
        </div>

        <div class="form-side">
            <div class="form-container active" id="signupForm">
                <h2>Crie sua conta</h2>
                <p class="subtitle">Cadastre seus dados</p>
                
                <form onsubmit="handleSignup(event)">
                    <div class="input-group">
                        <span class="input-icon">👤</span>
                        <input type="text" placeholder="Nome" required>
                    </div>
                    
                    <div class="input-group">
                        <span class="input-icon">✉️</span>
                        <input type="email" placeholder="E-mail" required>
                    </div>
                    
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" placeholder="Senha" required>
                    </div>
                    
                    <button type="submit" class="btn-submit">CADASTRAR</button>
                </form>
            </div>

            
            <div class="form-container" id="loginForm">
                <h2>Acesse sua conta</h2>
                <p class="subtitle">Entre com seus dados</p>
                
                <form onsubmit="handleLogin(event)">
                     <div class="input-group">
                        <span class="input-icon">✉️</span>
                        <input type="text" placeholder="E-mail" required>
                    </div>
                    
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" placeholder="Senha" required>
                    </div>
                    
                    <button type="submit" class="btn-submit">ENTRAR</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
